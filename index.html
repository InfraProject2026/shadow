.keys{color:var(--muted);font-size:12px;margin-top:6px}

<div class="wrap">

<script>
const DEFAULT = `Bogs are rich in storied horror, and the wetlands of eastern England are no exception.

The phantom lights of the will o' the wisp; the devil-dog Black Shuck lurking in the mist; strange rings where fairies dance, witchcraft rules, and only fools trespass — tales of the area are fraught with supernatural peril.

Even today, the region's 1,500 square miles of wetlands, which stretch from the chill bite of the North Sea to the spires of Cambridge, are a lonely place once the sun sets. It is all too easy to find yourself submerged in fetid water, or sucked into a slurry of thick, black mud.

The Fens, as they're called locally, are not alone. Similar wetlands are found across the globe, each with a name that has a subtly different meaning.

Bogs and fens (bogs are more acidic) are formed in lake basins, created by glaciers receding during the last ice age, and are now filled with rotting and decayed plant matter called peat. This is often capped with sphagnum moss, making the ground soft and treacherous.

Marshes, meanwhile, are flooded areas near rivers and coasts, the surface peppered with reeds and soft-stalked shrubs. Substitute these herbaceous plants for woody stumps and trees, and you have a swamp.

Regardless of what they're called, these realms are a fertile ground for our ghostly folklore.

Fog is one of the most formidable dangers in a bog.

"If you have enough relative humidity — water in the air — you get condensation onto aerosol particles," says Nadine Borduas-Dedekind, an atmospheric chemist at the University of British Columbia, Canada. "If you went to the Arctic, you'd never see fog as there are very few particles in the air. But in a swamp, there's biogenic material and water spray."

The main culprits for this fog are volatile organic compounds — small particles given off by plants that quickly evaporate. These, Borduas-Dedekind explains, oxidize in the air, forming larger molecules that can easily absorb water and form clouds.

The time of day this happens is also key to a wetland's illusions.

As the sun sets, the surface of the Earth cools. This makes the air denser and increases relative humidity, condensing more water vapor, and resulting in a phenomenon known as radiation fog.

This type of thick, low-lying cloud typically appears late at night or just before dawn — exactly the moment our tired minds are likely to start seeing shapes in the dark.

It's small wonder fiction's greatest detective, Sherlock Holmes, faced the savage Hound of the Baskervilles amid the nocturnal mists of a mire.

Perhaps it's unsurprising, then, that another of the wetlands' supernatural foes also plays with our disquiet in the dark.

Will o' the wisp — also known as ignis fatuus, jack-o'-lantern, or fool's light — are ghostly torches, said to lure travellers off the safe paths through the bogs and draw them into a sump from which they never return.

Although accounts of these lights have vanished in modern times, stories of such ghost lights still permeate our culture, inspiring both the Dead Marshes of JRR Tolkien's Lord of the Rings, and the pumpkins we put out at Halloween.

Numerous scientific explanations have been offered up for these lights. The most plausible is phosphine gas, created from the fermentation of plant matter inside the soil's low-oxygen environment.

As chemists at the University of Pavia, Italy, observed in 2013, the phosphine bubbles up to the surface, where it encounters nitrogen and oxygen in the atmosphere, a reaction that triggers a faint glow known as chemiluminescence.

This pale light is only visible in pitch darkness, explaining why it's no longer seen in our modern world filled with streetlights and distant homes.`;

function split(text){
  const out = [];
  text.split(/\n\s*\n|\n/).forEach(p => {
    p = p.trim(); if(!p) return;
    // split on . ! ? (optionally followed by quote) + space + uppercase/quote
    const parts = p.match(/[^.!?]+(?:[.!?]+["”’']?|$)(?=\s+["“'A-Z(]|\s*$)/g) || [p];
    let buf = '';
    parts.forEach(x => {
      buf += x;
      const t = buf.trim();
      // avoid splitting after short abbreviations
      if (/\b(Mr|Mrs|Dr|St|vs|e\.g|i\.e)\.$/.test(t)) return;
      if (t) out.push(t); buf = '';
    });
    if (buf.trim()) out.push(buf.trim());
  });
  return out;
}

const STOP = new Set('a an the and or but of in on at to for from by with as is are was were be been it its it\'s this that these those they them their there here what which who whom whose when where why how all any each both only also very just not no so if then than too can could would should will may might must do does did have has had i you he she we our your his her my me us one two up out off into over under about after before through while once even still such more most other another same own s t'.split(' '));

function lemma(w){
  w = w.toLowerCase().replace(/[’']s$/,'').replace(/’/g,"'");
  const tries = [w];
  const add = x => x && tries.push(x);
  if (/ies$/.test(w)) add(w.slice(0,-3)+'y');
  if (/es$/.test(w)) add(w.slice(0,-2));
  if (/s$/.test(w)) add(w.slice(0,-1));
  if (/ied$/.test(w)) add(w.slice(0,-3)+'y');
  if (/ed$/.test(w)){ const b=w.slice(0,-2); add(b); add(b+'e'); if(/(.)\1$/.test(b)) add(b.slice(0,-1)); }
  if (/ing$/.test(w)){ const b=w.slice(0,-3); add(b); add(b+'e'); if(/(.)\1$/.test(b)) add(b.slice(0,-1)); }
  if (/er$/.test(w)){ add(w.slice(0,-1)); add(w.slice(0,-2)); }
  if (/ly$/.test(w)) add(w.slice(0,-2));
  for (const t of tries) if (GLOSS[t]) return t;
  return null;
}
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function wrapWords(t){
  return t.split(/([A-Za-z]+(?:[’'][A-Za-z]+)?)/).map((p,i) => {
    if (i%2===0) return esc(p);
    const g = lemma(p);
    if (!g && STOP.has(p.toLowerCase())) return esc(p);
    return `<span class="w${g?' g':''}" data-w="${esc(p)}">${esc(p)}</span>`;
  }).join('');
}

// 释义浮窗：本文生词用内置释义；其他词在线查询（需联网，机器翻译）
const tip = document.createElement('div'); tip.id='tip'; tip.hidden=true; document.body.appendChild(tip);
const mtCache = {}; let tipTimer=null, hideTimer=null, tipWord='';
async function lookup(w){
  const g = lemma(w); if (g) return {txt:GLOSS[g], src:''};
  const k = w.toLowerCase(); if (mtCache[k]) return mtCache[k];
  try{
    const r = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(k)+'&langpair=en|zh-CN');
    const j = await r.json(); const txt = (j.responseData && j.responseData.translatedText) || '（未查到）';
    return mtCache[k] = {txt, src:'机翻'};
  }catch(e){ return {txt:'（未收录，联网后可查）', src:''}; }
}
function speakWord(w){ stopAll(); const u=new SpeechSynthesisUtterance(w); u.lang='en-US'; const v=voices[$('#voice').value]; if(v){u.voice=v;u.lang=v.lang;} u.rate=0.8; synth.speak(u); }
function showTip(el){
  const w = el.dataset.w; tipWord = w;

  tip.querySelector('b').textContent = w;
  tip.querySelector('button').onclick = e => { e.stopPropagation(); speakWord(w); };
  const r = el.getBoundingClientRect(); tip.hidden=false;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(r.left, innerWidth - tw - 8)) + 'px';
  tip.style.top = (r.top - th - 6 < 8 ? r.bottom + 6 : r.top - th - 6) + 'px';
  lookup(w).then(res => { if (tipWord!==w) return;
    tip.querySelector('.m').textContent = res.txt; tip.querySelector('.src').textContent = res.src;
    const th2 = tip.offsetHeight; tip.style.top = (r.top - th2 - 6 < 8 ? r.bottom + 6 : r.top - th2 - 6) + 'px'; });
}
const canHover = matchMedia('(hover:hover)').matches;
document.addEventListener('mouseover', e => { if (!canHover) return;
  const el = e.target.closest && e.target.closest('.w');
  if (e.target.closest && e.target.closest('#tip')){ clearTimeout(hideTimer); return; }
  clearTimeout(tipTimer);
  if (el){ clearTimeout(hideTimer); tipTimer = setTimeout(()=>showTip(el), 200); }
  else { hideTimer = setTimeout(()=>{ tip.hidden=true; tipWord=''; }, 250); }
});
addEventListener('scroll', () => { tip.hidden = true; tipWord=''; }, {passive:true});
document.addEventListener('click', e => { if (!e.target.closest('#tip') && !e.target.closest('.w')) { tip.hidden = true; tipWord=''; } });

function render(){
  const L = $('#list'); L.innerHTML = '';
  sents.forEach((t,i) => {
    const d = document.createElement('div'); d.className = 's'; d.id = 's'+i;
    d.innerHTML = `<div class="n">${i+1}</div><div class="txt"></div>
      <div class="ctl">
        <button data-a="play">▶ 原音</button>
        <button data-a="rec" class="rec">● 录音</button>
        <button data-a="mine" ${recs[i]?'':'disabled'}>♪ 我的</button>
        <button data-a="cmp" ${recs[i]?'':'disabled'}>⇄ 对比</button>
        <span class="tag"></span>
      </div>`;
    d.querySelector('.txt').innerHTML = wrapWords(t);
    d.querySelector('.txt').onclick = e => {
      const w = e.target.closest('.w');
      if (w){ e.stopPropagation(); speakWord(w.dataset.w); showTip(w);
        w.classList.add('hit'); setTimeout(()=>w.classList.remove('hit'),400); return; }
      select(i); stopAll(); speakOnce(i); };
    d.querySelector('.ctl').onclick = e => {
      const a = e.target.dataset.a; if(!a) return; select(i);
      if (a==='play'){ stopAll(); speakOnce(i); }
      if (a==='rec') toggleRec(i);
      if (a==='mine'){ stopAll(); playMine(i); }
      if (a==='cmp') compare(i);
    };
    L.appendChild(d);
  });
  select(Math.min(cur, sents.length-1));
}

function select(i, scroll){
  document.querySelectorAll('.s.cur').forEach(e=>e.classList.remove('cur'));
  cur = i; const el = $('#s'+i); if(!el) return;
  el.classList.add('cur');
  if (scroll) el.scrollIntoView({block:'center', behavior:'smooth'});
}

function loadVoices(){
  // 只保留清晰自然的母语声音（Siri 同款 / 高质量声音），去掉机械和搞怪声音
  const GOOD = /^(Nicky|Aaron|Samantha|Allison|Ava|Evan|Joelle|Nathan|Noelle|Susan|Tom|Zoe|Alex)\b/i;
  voices = synth.getVoices().filter(v => /^en-US/i.test(v.lang.replace('_','-')) &&
    (GOOD.test(v.name) || /premium|enhanced|natural|Google US English/i.test(v.name)));
  const rank = v => (/^Nicky/i.test(v.name)?0:1) + (/premium|enhanced|natural/i.test(v.name)?-0.5:0) ;
  if (!voices.length) voices = synth.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
  if (!voices.length) voices = synth.getVoices().filter(v => /^en/i.test(v.lang));
  voices.sort((a,b)=>rank(a)-rank(b));
  const sel = $('#voice'), saved = LS('voice');
  sel.innerHTML = voices.map((v,i)=>`<option value="${i}">${v.name.replace(/\s*\(.*\)$/,'')}</option>`).join('');
  const si = voices.findIndex(v=>v.name===saved);
  if (si>=0) sel.value = si;
  $('#msg').textContent = voices.length ? '' : '没有检测到英文语音。安卓：设置 → 系统 → 语言 → 文字转语音 → 首选引擎选 Google，并下载英语（美国）语音包；苹果：系统设置 → 辅助功能 → 朗读内容 中下载声音。然后刷新。';
}
$('#voice').onchange = () => LSset('voice', voices[$('#voice').value]?.name || '');

function speak(i){
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(sents[i]); u.lang = 'en-US';
    const v = voices[$('#voice').value]; if (v){ u.voice = v; u.lang = v.lang; }
    u.rate = +$('#rate').value;
    const el = $('#s'+i), t0 = performance.now();
    u.onstart = () => el && el.classList.add('speaking');
    u.onend = u.onerror = () => { el && el.classList.remove('speaking'); durs[i] = (performance.now()-t0)/1000; res(); };
    synth.speak(u);
  });
}
const wait = s => new Promise(r=>setTimeout(r, s*1000));

async function speakOnce(i){ const tk = ++runToken; const n = Math.max(1, +$('#rep').value||1);
  for (let k=0;k<n;k++){ if (tk!==runToken) return; await speak(i);
    if (k<n-1){ await wait(Math.max(0.6,(durs[i]||2)*(+$('#gap').value||0.4))); } } }

async function playAll(){
  stopAll(); const tk = ++runToken;
  const n = Math.max(1, +$('#rep').value||1), g = +$('#gap').value;
  for (let i=cur;i<sents.length;i++){
    select(i,true);
    for (let k=0;k<n;k++){
      if (tk!==runToken) return;
      await speak(i);
      if (tk!==runToken) return;
      await wait(g ? (durs[i]||2)*g : 0.35);
    }
  }
}

function stopAll(){ runToken++; synth.cancel(); if (audioEl){ audioEl.pause(); audioEl=null; }
  document.querySelectorAll('.speaking').forEach(e=>e.classList.remove('speaking')); }

async function toggleRec(i){
  if (mediaRec && mediaRec.state==='recording'){ mediaRec.stop(); return; }
  stopAll();
  try{
    stream = stream || await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){ $('#msg').textContent = '无法使用麦克风：请在浏览器/应用权限里允许麦克风后重试。'; return; }
  $('#msg').textContent = '';
  const chunks = []; recIdx = i;
  mediaRec = new MediaRecorder(stream);
  mediaRec.ondataavailable = e => chunks.push(e.data);
  mediaRec.onstop = () => {
    if (recs[i]) URL.revokeObjectURL(recs[i]);
    recs[i] = URL.createObjectURL(new Blob(chunks, {type: mediaRec.mimeType}));
    const el = $('#s'+i);
    el.querySelector('[data-a=rec]').classList.remove('on');
    el.querySelector('[data-a=rec]').textContent = '● 重录';
    el.querySelectorAll('[data-a=mine],[data-a=cmp]').forEach(b=>b.disabled=false);
    el.querySelector('.tag').textContent = '已录音';
    recIdx = -1;
  };
  mediaRec.start();
  const b = $('#s'+i).querySelector('[data-a=rec]'); b.classList.add('on'); b.textContent = '■ 停止录音';
}

function playMine(i){ return new Promise(res => {
  if (!recs[i]) return res();
  audioEl = new Audio(recs[i]); audioEl.onended = audioEl.onerror = res; audioEl.play().catch(res);
});}

async function compare(i){ stopAll(); const tk = ++runToken;
  await speak(i); if (tk!==runToken) return; await wait(0.4); if (tk!==runToken) return; await playMine(i); }

$('#playAll').onclick = playAll;
$('#stop').onclick = stopAll;
$('#apply').onclick = () => { stopAll(); LSset('meta',''); showMeta(null); recs = {}; durs = {}; cur = 0; sents = split($('#src').value); LSset('text', $('#src').value); render(); };

document.addEventListener('keydown', e => {
  if (e.target.matches('textarea,input,select')) return;
  const k = e.key.toLowerCase();
  if (k===' '){ e.preventDefault(); stopAll(); speakOnce(cur); }
  else if (k==='arrowdown'){ e.preventDefault(); select(Math.min(cur+1,sents.length-1),true); }
  else if (k==='arrowup'){ e.preventDefault(); select(Math.max(cur-1,0),true); }
  else if (k==='r') toggleRec(cur);
  else if (k==='m'){ stopAll(); playMine(cur); }
  else if (k==='c') compare(cur);
  else if (k==='escape'){ stopAll(); if (mediaRec && mediaRec.state==='recording') mediaRec.stop(); }
});

// ===== 一键生成文章（Claude API + 联网检索） =====
const SITES = ['bbc.com','apnews.com','npr.org','cnn.com','reuters.com','economist.com','bloomberg.com'];
function showMeta(m){
  const box = $('#meta');
  if (!m || !m.title){ box.hidden = true; return; }
  box.innerHTML = '<h2></h2><div class="srcs"></div>';
  box.querySelector('h2').textContent = m.title;
  const s = box.querySelector('.srcs');
  (m.sources||[]).forEach(x => { if (!/^https?:\/\//.test(x.url||'')) return;
    const a = document.createElement('a'); a.href = x.url; a.target = '_blank'; a.rel = 'noopener';
    a.textContent = (x.outlet ? x.outlet + '：' : '') + (x.title || x.url); s.appendChild(a); });
  box.hidden = false;
}
function applyVocab(v){ if (v) for (const k in v) GLOSS[k.toLowerCase().trim()] = v[k]; }

async function callClaude(key, messages){
  const body = { model:'claude-sonnet-5-5', max_tokens:4000, messages,
    tools:[{type:'web_search_20250305', name:'web_search', max_uses:4, allowed_domains:SITES}] };
  const r = await fetch('https://api.anthropic.com/v1/messages', { method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01',
             'anthropic-dangerous-direct-browser-access':'true'},
    body: JSON.stringify(body) });
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error((j.error && j.error.message) || ('HTTP ' + r.status));
  return j;
}

async function genArticle(){
  const msg = $('#genMsg'); msg.className = '';
  const key = ($('#key').value || LS('apikey') || '').trim();
  if (!key){ $('#keyBox').open = true; $('#key').focus(); msg.className='err'; msg.textContent = '请先填写 API Key'; return; }
  LSset('apikey', key);
  const btn = $('#gen'); btn.disabled = true; stopAll();
  msg.textContent = '正在检索最新报道并撰写，约 30–90 秒…';
  const today = new Date().toISOString().slice(0,10);
  const prompt = `Today is ${today}. Search the web for the most important stories of the past few days on: ${$('#topic').value}. Use reporting from BBC News, AP, NPR, CNN, Reuters, The Economist and Bloomberg, cross-checking facts across at least two outlets.

Pick ONE story (or a closely linked cluster) and write an ORIGINAL English news feature for an advanced English learner who practises shadowing (reading aloud after a native speaker).
- Length: 380-450 words (2.5-3 minutes read aloud). 5-7 paragraphs.
- Style: the clear, natural, idiomatic prose of BBC News and The Economist. Vary sentence length. Explain context a general reader needs. No bullet points, no headings inside the body.
- Write entirely in your own words. Do not copy sentences from the sources; any direct quote must be under 10 words.
- Facts must come from what you found; do not invent numbers or quotes.

Then choose 15-25 words a CET-6 / IELTS 6.5 learner may not know. Keys are single lowercase base-form words (e.g. "tariff", "curb"); values are part of speech + concise Chinese meaning in this context (phrases can go in the value, e.g. "v. 抑制（curb inflation 抑制通胀）").

Reply with ONLY this JSON, nothing else:
{"title":"...","paragraphs":["...","..."],"vocab":{"word":"n. 中文"},"sources":[{"outlet":"BBC","title":"...","url":"https://..."}]}`;
  try{
    let messages = [{role:'user', content:prompt}], j, n = 0;
    do { j = await callClaude(key, messages);
         if (j.stop_reason === 'pause_turn') messages = [messages[0], {role:'assistant', content:j.content}];
    } while (j.stop_reason === 'pause_turn' && ++n < 3);
    const text = (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('');
    const a = text.indexOf('{'), b = text.lastIndexOf('}');
    if (a < 0 || b <= a) throw new Error('返回内容不是预期格式，请再试一次');
    const art = JSON.parse(text.slice(a, b+1));
    if (!art.paragraphs || !art.paragraphs.length) throw new Error('没有生成正文，请再试一次');
    const body = art.paragraphs.join('\n\n');
    const meta = {title:art.title, sources:art.sources||[], vocab:art.vocab||{}};
    applyVocab(meta.vocab); LSset('meta', JSON.stringify(meta)); LSset('text', body);
    $('#src').value = body; recs = {}; durs = {}; cur = 0; sents = split(body);
    showMeta(meta); render(); window.scrollTo({top:0, behavior:'smooth'});
    const words = body.split(/\s+/).length;
    msg.textContent = `已生成 ${words} 词，约 ${Math.round(words/150*10)/10} 分钟`;
  }catch(e){
    msg.className = 'err';
    msg.textContent = /fetch|network/i.test(e.message) ? '网络连接失败，请检查网络后重试' :
      /authentication|api.key|x-api-key/i.test(e.message) ? 'API Key 无效，请检查后重新填写' :
      /credit|balance|billing/i.test(e.message) ? 'API 账户余额不足，请到 console.anthropic.com 充值' : ('生成失败：' + e.message);
  }finally{ btn.disabled = false; }
}
$('#gen').onclick = genArticle;
$('#key').value = LS('apikey') || '';
$('#key').onchange = () => LSset('apikey', $('#key').value.trim());
try{ const m = JSON.parse(LS('meta') || 'null'); if (m){ applyVocab(m.vocab); showMeta(m); } }catch(e){}

$('#src').value = LS('text') || DEFAULT;
sents = split($('#src').value);
render();
loadVoices();
if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
